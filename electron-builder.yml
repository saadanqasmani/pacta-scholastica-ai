appId: app.iris.desktop
productName: IRIS
copyright: © 2026 IRIS — International Relations Intelligent System

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json
  # The local AI runtime ships CPU and Vulkan builds (which cover every
  # laptop, NVIDIA included). The CUDA builds add ~575 MB and are skipped;
  # node-llama-cpp falls back to Vulkan/CPU automatically.
  - "!node_modules/@node-llama-cpp/*cuda*/**"
  - "!node_modules/@node-llama-cpp/*arm64*/**"

# Primary target: USB-portable single .exe — plug-and-play, no install.
# User data is kept next to the executable (see PORTABLE_EXECUTABLE_DIR
# handling in electron/main.js) so the database travels with the stick.
win:
  target:
    - portable
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}

linux:
  target:
    - AppImage
  category: Office

mac:
  target:
    - dmg
  category: public.app-category.productivity

asarUnpack:
  - node_modules/node-llama-cpp/**
  - "node_modules/@node-llama-cpp/**"
